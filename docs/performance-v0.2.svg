<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img"><title>Controlled throughput comparison</title><rect x="0.5" y="0.5" width="899" height="309" rx="10" fill="#0b121b" stroke="#293b4d" stroke-width="1"/><text x="26" y="34" font-family="Arial, sans-serif" font-size="22" fill="#eef5fb" font-weight="bold" text-anchor="start">Gesture Interface v0.2 / Processing throughput</text><text x="26" y="58" font-family="Arial, sans-serif" font-size="14" fill="#99adbf" font-weight="normal" text-anchor="start">Fixed public frame · 640 × 480 · 2 runs per condition · browser mocked</text><text x="26" y="102" font-family="Arial, sans-serif" font-size="15" fill="#eef5fb" font-weight="bold" text-anchor="start">v0.1 developer</text><rect x="205" y="82" width="570" height="27" rx="3" fill="#1f2c3b" stroke="none" stroke-width="1"/><rect x="205" y="82" width="364.7600109375" height="27" rx="3" fill="#8495a7" stroke="none" stroke-width="1"/><text x="870" y="102" font-family="Arial, sans-serif" font-size="16" fill="#eef5fb" font-weight="bold" text-anchor="end">20.478 FPS</text><text x="26" y="157" font-family="Arial, sans-serif" font-size="15" fill="#eef5fb" font-weight="bold" text-anchor="start">v0.2 hidden</text><rect x="205" y="137" width="570" height="27" rx="3" fill="#1f2c3b" stroke="none" stroke-width="1"/><rect x="205" y="137" width="526.30494" height="27" rx="3" fill="#22d3ee" stroke="none" stroke-width="1"/><text x="870" y="157" font-family="Arial, sans-serif" font-size="16" fill="#eef5fb" font-weight="bold" text-anchor="end">29.547 FPS</text><text x="26" y="212" font-family="Arial, sans-serif" font-size="15" fill="#eef5fb" font-weight="bold" text-anchor="start">v0.2 visible</text><rect x="205" y="192" width="570" height="27" rx="3" fill="#1f2c3b" stroke="none" stroke-width="1"/><rect x="205" y="192" width="530.956033125" height="27" rx="3" fill="#22d3ee" stroke="none" stroke-width="1"/><text x="870" y="212" font-family="Arial, sans-serif" font-size="16" fill="#eef5fb" font-weight="bold" text-anchor="end">29.808 FPS</text><text x="26" y="269" font-family="Arial, sans-serif" font-size="22" fill="#22d3ee" font-weight="bold" text-anchor="start">+44.29% hidden / +45.56% visible</text><text x="26" y="292" font-family="Arial, sans-serif" font-size="13" fill="#99adbf" font-weight="normal" text-anchor="start">Not webcam FPS or an AI model speedup. GUI workloads differ; one machine, short runs.</text></svg>
