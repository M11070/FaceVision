<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 422" width="900" height="422" role="img"><title>FaceVision v0.2 architecture</title><rect x="0.5" y="0.5" width="899" height="421" rx="10" fill="#0b121b" stroke="#293b4d" stroke-width="1"/><text x="26" y="34" font-family="Arial, sans-serif" font-size="23" fill="#eef5fb" font-weight="bold" text-anchor="start">FaceVision v0.2 / Architecture</text><text x="26" y="57" font-family="Arial, sans-serif" font-size="14" fill="#99adbf" font-weight="normal" text-anchor="start">One camera · local face and gesture processing · asynchronous launch</text><rect x="335" y="75" width="230" height="58" rx="7" fill="#111e2c" stroke="#293b4d" stroke-width="1"/><text x="450" y="97" font-family="Arial, sans-serif" font-size="15" fill="#22d3ee" font-weight="bold" text-anchor="middle">Camera worker</text><text x="450" y="117" font-family="Arial, sans-serif" font-size="12" fill="#99adbf" font-weight="normal" text-anchor="middle">app.py • single capture</text><path d="M450 133V148H220V163 M450 148H680V163" stroke="#718298" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="163" width="330" height="65" rx="7" fill="#111e2c" stroke="#293b4d" stroke-width="1"/><text x="220" y="185" font-family="Arial, sans-serif" font-size="15" fill="#f1c64b" font-weight="bold" text-anchor="middle">YuNet + SFace + Tracker</text><text x="220" y="205" font-family="Arial, sans-serif" font-size="12" fill="#99adbf" font-weight="normal" text-anchor="middle">Face IDs and local owner matching</text><rect x="515" y="163" width="330" height="65" rx="7" fill="#111e2c" stroke="#293b4d" stroke-width="1"/><text x="680" y="185" font-family="Arial, sans-serif" font-size="15" fill="#22d3ee" font-weight="bold" text-anchor="middle">MediaPipe worker</text><text x="680" y="205" font-family="Arial, sans-serif" font-size="12" fill="#99adbf" font-weight="normal" text-anchor="middle">Latest-frame hand inference</text><path d="M220 228V240H450 M680 228V240H450V255" stroke="#718298" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="260" y="255" width="380" height="55" rx="7" fill="#111e2c" stroke="#293b4d" stroke-width="1"/><text x="450" y="277" font-family="Arial, sans-serif" font-size="15" fill="#22d3ee" font-weight="bold" text-anchor="middle">CameraMailbox</text><text x="450" y="297" font-family="Arial, sans-serif" font-size="12" fill="#99adbf" font-weight="normal" text-anchor="middle">Latest immutable FrameState • no image arrays</text><path d="M450 310V324H240V339 M450 324H660V339" stroke="#718298" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="339" width="380" height="58" rx="7" fill="#111e2c" stroke="#293b4d" stroke-width="1"/><text x="240" y="361" font-family="Arial, sans-serif" font-size="15" fill="#22d3ee" font-weight="bold" text-anchor="middle">Tk main thread / menu FSM</text><text x="240" y="381" font-family="Arial, sans-serif" font-size="12" fill="#99adbf" font-weight="normal" text-anchor="middle">launcher_ui.py + gesture_interface.py</text><rect x="470" y="339" width="380" height="58" rx="7" fill="#111e2c" stroke="#293b4d" stroke-width="1"/><text x="660" y="361" font-family="Arial, sans-serif" font-size="15" fill="#22d3ee" font-weight="bold" text-anchor="middle">Action worker</text><text x="660" y="381" font-family="Arial, sans-serif" font-size="12" fill="#99adbf" font-weight="normal" text-anchor="middle">Fixed HTTPS destinations • default browser</text><path d="M430 368H470" stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="415" font-family="Arial, sans-serif" font-size="12" fill="#99adbf" font-weight="normal" text-anchor="start">Developer mode retains the original camera view and v0.1 sequence.</text></svg>
