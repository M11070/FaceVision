<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img"><title>FaceVision / Processing architecture</title><desc>Local CPU pipeline • diagram based on app.py, face_vision.py, tracking.py and gestures.py</desc><rect x="0.5" y="0.5" width="899" height="489" rx="12" fill="#10161e" stroke="#36414f"/><text x="26" y="36" font-family="Arial, sans-serif" font-size="23" fill="#f2f5f8" font-weight="bold" text-anchor="start">FaceVision / Processing architecture</text><text x="26" y="59" font-family="Arial, sans-serif" font-size="14" fill="#a4b3c4" font-weight="normal" text-anchor="start">Local CPU pipeline • diagram based on app.py, face_vision.py, tracking.py and gestures.py</text><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#91a3b7"/></marker></defs><rect x="328" y="82" width="244" height="63" rx="8" fill="#18232e" stroke="#3a495b"/><text x="450" y="108" font-family="Arial, sans-serif" font-size="17" fill="#6bd5e6" font-weight="bold" text-anchor="middle">Webcam</text><text x="450" y="129" font-family="Arial, sans-serif" font-size="13" fill="#dce4ed" font-weight="normal" text-anchor="middle">OpenCV video frame</text><path d="M450 145 V159 H235 V176 M450 159 H665 V176" fill="none" stroke="#91a3b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="176" width="380" height="70" rx="8" fill="#18232e" stroke="#3a495b"/><text x="235" y="202" font-family="Arial, sans-serif" font-size="17" fill="#6bd5e6" font-weight="bold" text-anchor="middle">YuNet face detection</text><text x="235" y="223" font-family="Arial, sans-serif" font-size="13" fill="#dce4ed" font-weight="normal" text-anchor="middle">Face boxes + five landmarks</text><rect x="475" y="176" width="380" height="70" rx="8" fill="#18232e" stroke="#3a495b"/><text x="665" y="202" font-family="Arial, sans-serif" font-size="17" fill="#6bd5e6" font-weight="bold" text-anchor="middle">Latest-frame buffer</text><text x="665" y="223" font-family="Arial, sans-serif" font-size="13" fill="#dce4ed" font-weight="normal" text-anchor="middle">Separate hand inference thread</text><path d="M235 246 V265" fill="none" stroke="#91a3b7" stroke-width="1.8" marker-end="url(#a)"/><path d="M665 246 V265" fill="none" stroke="#91a3b7" stroke-width="1.8" marker-end="url(#a)"/><rect x="45" y="265" width="380" height="85" rx="8" fill="#18232e" stroke="#3a495b"/><text x="235" y="291" font-family="Arial, sans-serif" font-size="17" fill="#f0d96b" font-weight="bold" text-anchor="middle">SFace + temporary tracking</text><text x="235" y="312" font-family="Arial, sans-serif" font-size="13" fill="#dce4ed" font-weight="normal" text-anchor="middle">Local owner matching and session IDs</text><text x="235" y="329" font-family="Arial, sans-serif" font-size="13" fill="#dce4ed" font-weight="normal" text-anchor="middle">Uncertain matches do not become OWNER</text><rect x="475" y="265" width="380" height="85" rx="8" fill="#18232e" stroke="#3a495b"/><text x="665" y="291" font-family="Arial, sans-serif" font-size="17" fill="#6bd5e6" font-weight="bold" text-anchor="middle">MediaPipe Gesture Recognizer</text><text x="665" y="312" font-family="Arial, sans-serif" font-size="13" fill="#dce4ed" font-weight="normal" text-anchor="middle">Up to two hands; seven gesture labels</text><text x="665" y="329" font-family="Arial, sans-serif" font-size="13" fill="#dce4ed" font-weight="normal" text-anchor="middle">Stabilization and stale-result rejection</text><path d="M235 350 V369 H450 M665 350 V369 H450" fill="none" stroke="#91a3b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 369 V385" fill="none" stroke="#91a3b7" stroke-width="1.8" marker-end="url(#a)"/><rect x="240" y="385" width="420" height="70" rx="8" fill="#18232e" stroke="#3a495b"/><text x="450" y="411" font-family="Arial, sans-serif" font-size="17" fill="#e9edf3" font-weight="bold" text-anchor="middle">OpenCV interface</text><text x="450" y="432" font-family="Arial, sans-serif" font-size="13" fill="#dce4ed" font-weight="normal" text-anchor="middle">Face rectangles, hand rectangles, status and FPS</text><text x="26" y="475" font-family="Arial, sans-serif" font-size="13" fill="#a4b3c4" font-weight="normal" text-anchor="start">No cloud inference • landmarks are internal, not a displayed facial or hand mesh.</text></svg>